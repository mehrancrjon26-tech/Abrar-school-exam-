<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>آزمون آنلاین</title>
<style>
:root{--p:#eef2f5;--i:#12263a;--a:#0e7c86;--r:#c0392b;--l:#cbd5de}
*{-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,sans-serif;background:var(--p);color:var(--i);margin:0;padding:0 14px 14px;line-height:1.9;-webkit-user-select:none;user-select:none}
textarea,input{-webkit-user-select:text;user-select:text}
#app{max-width:640px;margin:auto}
#top{position:sticky;top:0;background:var(--p);padding:10px 0 6px;z-index:5}
#tm{background:var(--i);color:#fff;padding:8px;text-align:center;border-radius:10px;font-weight:bold;transition:background .3s}
#tm.low{background:var(--r)}
#bar{height:6px;background:var(--l);border-radius:3px;margin-top:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--a);transition:width .4s}
.q{background:#fff;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0001}
.q h3{margin:4px 0 12px;font-size:18px;line-height:2}
.f{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.o{padding:13px 14px;border:2px solid var(--l);border-radius:10px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s}
.o:active{transform:scale(.98)}
.o.s{border-color:var(--a);background:#e3f4f5;font-weight:bold}
input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid var(--l);font:inherit;color:var(--i);background:#fff}
textarea{min-height:130px;resize:vertical}
button{background:var(--a);color:#fff;border:0;transition:opacity .15s}
button:active{opacity:.8}button:disabled{opacity:.35}
button.g{background:#fff;color:var(--i);border:1px solid var(--l)}
#nv{position:sticky;bottom:0;display:flex;gap:8px;background:var(--p);padding:8px 0}
#nv button{flex:1;margin:0}
#dots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 20px}
#dots b{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#fff;border:1px solid var(--l);font-size:14px;cursor:pointer}
#dots b.d{background:#cdeaec;border-color:var(--a)}#dots b.c{background:var(--i);color:#fff;border-color:var(--i)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><p>در حال بارگذاری…</p></div>
<script>
const $=id=>document.getElementById(id),A=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const H=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
let E,S,away=null,tk,dt;
const K=()=>'ex_'+E.id,save=()=>{try{localStorage.setItem(K(),JSON.stringify(S))}catch(e){}};
const has=k=>S.a[k]!==undefined&&S.a[k]!=='';
fetch('exam.json?'+Date.now()).then(r=>r.json()).then(e=>{E=e;try{S=JSON.parse(localStorage.getItem(K())||'null')}catch(x){S=null}
 if(!S)login();else if(S.done)fin();else{S.ch.push({t:new Date().toLocaleTimeString('fa-IR'),y:'ورود مجدد به آزمون',s:0});save();run()}
}).catch(()=>A.innerHTML='<p>آزمون هنوز منتشر نشده است.</p>');
function login(){A.innerHTML=`<div class="q f"><h2>${esc(E.title)}</h2><p>مدت آزمون: ${E.minutes} دقیقه، از ${E.start?new Date(E.start).toLocaleTimeString('fa-IR'):'ورود شما'}. اگر دیر وارد شوید زمان کمتری دارید. زمان با ترک صفحه متوقف نمی‌شود و هر خروج از صفحه، حتی یک لحظه، به‌عنوان تقلب ثبت می‌شود.</p><input id=n placeholder="نام و نام خانوادگی"><input id=i placeholder="کد ملی" inputmode=numeric><button onclick=start()>شروع آزمون</button></div>`}
function start(){const n=$('n').value.trim(),i=$('i').value.trim();if(!n||!i)return alert('نام و کد ملی را وارد کنید');if(E.start){const w=E.start-Date.now();if(w>0)return alert('آزمون هنوز شروع نشده است. شروع: '+new Date(E.start).toLocaleTimeString('fa-IR'));if(w+E.minutes*60000<=0)return alert('زمان آزمون تمام شده است.')}S={n,i,st:Date.now(),a:{},ch:[],done:0,k:0};save();run()}
function run(){A.innerHTML=`<div id=top><div id=tm></div><div id=bar><i id=pr></i></div></div><div id=qb></div><div id=nv></div><div id=dots></div>`;clearInterval(tk);tk=setInterval(tick,1000);show(S.k||0);tick()}
function show(k){S.k=k;save();const q=E.q[k];
 $('qb').innerHTML=`<div class="q f"><small>سوال ${k+1} از ${E.q.length}</small><h3>${esc(q.q)}</h3>`+(q.t=='mc'?q.o.map((o,j)=>`<div class="o${S.a[k]===j?' s':''}" onclick="pick(${k},${j})">${esc(o)}</div>`).join(''):`<textarea placeholder="پاسخ را بنویسید…" oninput="ans(${k},this.value)">${esc(S.a[k]||'')}</textarea>`)+`</div>`;
 $('nv').innerHTML=`<button class=g ${k?'':'disabled'} onclick="show(${k-1})">قبلی</button>`+(k<E.q.length-1?`<button onclick="show(${k+1})">بعدی</button>`:`<button onclick=fnl()>پایان آزمون</button>`);
 dots();scrollTo({top:0})}
function pick(k,j){S.a[k]=j;save();document.querySelectorAll('.o').forEach((e,i)=>e.classList.toggle('s',i==j));dots()}
function ans(k,v){S.a[k]=v;clearTimeout(dt);dt=setTimeout(()=>{save();dots()},300)}
function dots(){$('dots').innerHTML=E.q.map((q,k)=>`<b class="${has(k)?'d':''}${k==S.k?' c':''}" onclick="show(${k})">${k+1}</b>`).join('');$('pr').style.width=E.q.filter((q,k)=>has(k)).length/E.q.length*100+'%'}
function fnl(){const n=E.q.filter((q,k)=>!has(k)).length;if(confirm(n?`${n} سوال بدون پاسخ است. آزمون پایان یابد؟`:'آزمون پایان یابد؟'))end()}
function tick(){const L=(E.start||S.st)+E.minutes*60000-Date.now();if(L<=0)return end();const m=Math.floor(L/60000),s=Math.floor(L/1000)%60,t=$('tm');if(!t)return;t.textContent=`زمان باقی‌مانده: ${m}:${String(s).padStart(2,'0')}`;t.className=L<60000?'low':''}
function end(){clearInterval(tk);clearTimeout(dt);back();S.done=1;S.et=Date.now();save();fin()}
function fin(){const p=enc({id:E.id,n:S.n,i:S.i,a:S.a,ch:S.ch,st:S.st,et:S.et}),code=p+'.'+H(p+E.key);
 A.innerHTML=`<div class="q f"><h2>آزمون ثبت شد ✅</h2><p>کد زیر را کپی کنید و برای مدیر مدرسه بفرستید:</p><textarea id=cd readonly>${code}</textarea><button onclick="$('cd').select();document.execCommand('copy');this.textContent='کپی شد ✔'">کپی کد</button></div>`}
function out(y){if(S&&!S.done&&away===null){away=Date.now();S.ch.push({t:new Date().toLocaleTimeString('fa-IR'),y,s:0});save()}}
function back(){if(away!==null&&S.ch.length){S.ch[S.ch.length-1].s=Math.round((Date.now()-away)/1000);away=null;save()}}
document.addEventListener('visibilitychange',()=>document.hidden?out('تغییر تب یا خروج از برنامه'):back());
addEventListener('blur',()=>out('خروج از صفحه'));addEventListener('focus',back);addEventListener('pagehide',()=>out('بستن صفحه'));
</script></body></html>
